<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cull — one folder, two arrows</title>
<meta name="description" content="Open a folder of photos and send each one left or right. Each arrow can delete, keep, or move to a folder. Runs entirely in your browser." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e0f11'/%3E%3Cpath d='M13 10 L8 16 L13 22' fill='none' stroke='%23c8664a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M19 10 L24 16 L19 22' fill='none' stroke='%2363ac86' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --page: #0e0f11;
    --surface: #16181c;
    --raised: #1e2126;
    --line: #272b31;
    --text: #ebe9e4;
    --dim: #8a9098;
    --faint: #575d66;
    --left: #c8664a;
    --right: #63ac86;
    --left-soft: rgba(200, 102, 74, 0.13);
    --right-soft: rgba(99, 172, 134, 0.13);
    --snap: 180ms cubic-bezier(0.2, 0, 0, 1);
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page); color: var(--text); overflow: hidden;
    font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 15px; line-height: 1.6;
    -webkit-font-smoothing: antialiased; display: flex; flex-direction: column;
  }
  button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--right); outline-offset: 3px; }
  .hidden { display: none !important; }
  .tag { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
  kbd { font-family: var(--mono); font-size: 10.5px; color: var(--dim); border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px; }
  ::selection { background: var(--text); color: var(--page); }

  .btn {
    font-family: var(--mono); font-size: 13px; border: 1px solid var(--line); border-radius: 7px;
    padding: 11px 20px; background: var(--surface); transition: border-color var(--snap), background var(--snap);
  }
  .btn:hover { border-color: var(--faint); background: var(--raised); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.big { background: var(--text); color: var(--page); border-color: var(--text); font-size: 15px; padding: 15px 30px; }
  .btn.big:hover { background: #fff; border-color: #fff; }
  .link { font-family: var(--mono); font-size: 12.5px; color: var(--dim); padding: 8px 10px; border-radius: 5px; transition: color var(--snap), background var(--snap); }
  .link:hover { color: var(--text); background: var(--surface); }

  /* ---------- home ---------- */
  #home { flex: 1; display: grid; place-items: center; padding: 24px; text-align: center; }
  #home h1 { font-weight: 450; font-size: clamp(26px, 5vw, 38px); letter-spacing: -0.02em; margin: 0 0 28px; }
  #home .sub { color: var(--dim); margin: 22px 0 0; font-size: 14px; }
  #home .mark { display: block; margin: 0 auto 26px; }
  #err { display: block; margin-top: 16px; min-height: 18px; font-family: var(--mono); font-size: 12.5px; color: var(--left); }

  /* ---------- deck ---------- */
  #deck { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .top { display: flex; align-items: center; gap: 14px; padding: 12px 18px; flex: none; }
  .top .n { font-family: var(--mono); font-size: 13px; }
  .top .n span { color: var(--faint); }
  .top .f { font-family: var(--mono); font-size: 12px; color: var(--dim); margin-left: auto;
    max-width: 42vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; }
  .bar { height: 2px; background: var(--line); flex: none; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--text); transition: width 300ms cubic-bezier(0.2, 0, 0, 1); }
  .stage { flex: 1; display: grid; place-items: center; padding: 22px; min-height: 0; overflow: hidden; position: relative; touch-action: pan-y; }
  #plate { max-width: 100%; max-height: 100%; display: flex; transition: transform var(--snap), opacity var(--snap); }
  #plate img { display: block; max-width: min(94vw, 1200px); max-height: 100%; object-fit: contain; border-radius: 2px; }
  #plate.drag { transition: none; }
  #plate.gone-l { transform: translateX(-34vw) rotate(-3deg); opacity: 0; }
  #plate.gone-r { transform: translateX(34vw) rotate(3deg); opacity: 0; }
  .wash { position: absolute; top: 0; bottom: 0; width: 32%; opacity: 0; pointer-events: none; transition: opacity var(--snap); }
  .wash.l { left: 0; background: linear-gradient(90deg, var(--left-soft), transparent); }
  .wash.r { right: 0; background: linear-gradient(270deg, var(--right-soft), transparent); }
  .wash.on { opacity: 1; }

  .strip { display: flex; justify-content: center; gap: 5px; padding: 10px 18px 4px; flex: none; min-height: 46px; }
  .thumb { width: 34px; height: 34px; border-radius: 4px; overflow: hidden; border: 1px solid var(--line);
    opacity: 0.4; position: relative; transition: opacity var(--snap), border-color var(--snap), transform var(--snap); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb:hover { opacity: 0.75; }
  .thumb.now { opacity: 1; border-color: var(--text); transform: scale(1.16); }
  .thumb i { position: absolute; inset: auto 0 0 0; height: 3px; display: block; }
  .thumb i.l { background: var(--left); } .thumb i.r { background: var(--right); }

  .choices { display: flex; gap: 10px; padding: 6px 18px 0; flex: none; }
  .choice {
    flex: 1; border: 1px solid var(--line); border-radius: 9px; background: var(--surface);
    padding: 16px 18px; display: flex; align-items: center; gap: 13px; min-width: 0;
    transition: border-color var(--snap), background var(--snap);
  }
  .choice .arrow { font-family: var(--mono); font-size: 17px; flex: none; }
  .choice .what { font-family: var(--mono); font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .choice.l { justify-content: flex-start; } .choice.l .arrow { color: var(--left); }
  .choice.r { justify-content: flex-end; flex-direction: row-reverse; } .choice.r .arrow { color: var(--right); }
  .choice.l:hover, .choice.l.on { border-color: var(--left); background: var(--left-soft); }
  .choice.r:hover, .choice.r.on { border-color: var(--right); background: var(--right-soft); }
  .under { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 18px 16px; flex: none; }
  @media (max-width: 620px) {
    .choice { padding: 14px; } .choice .what { font-size: 13.5px; }
    .top .f { max-width: 36vw; } .thumb { width: 28px; height: 28px; }
  }

  /* ---------- sheet ---------- */
  #sheet { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 20px;
    background: rgba(8, 9, 10, 0.72); }
  .card { width: 100%; max-width: 460px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 26px; }
  .card h2 { font-weight: 450; font-size: 19px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .card .hint { color: var(--dim); font-size: 13.5px; margin: 0 0 22px; }
  .set { margin-bottom: 18px; }
  .set > .tag { display: block; margin-bottom: 8px; }
  .opts { display: flex; gap: 7px; }
  .opt { flex: 1; border: 1px solid var(--line); border-radius: 7px; padding: 11px 6px; font-family: var(--mono); font-size: 12.5px;
    text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: border-color var(--snap), background var(--snap), color var(--snap); }
  .opt:hover { border-color: var(--faint); }
  .set.l .opt.on { border-color: var(--left); background: var(--left-soft); color: var(--text); }
  .set.r .opt.on { border-color: var(--right); background: var(--right-soft); color: var(--text); }
  .card .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 24px; }
  #sheet-err { font-family: var(--mono); font-size: 12px; color: var(--left); min-height: 16px; margin-top: 4px; }

  /* ---------- done ---------- */
  #done { flex: 1; display: grid; place-items: center; padding: 24px; text-align: center; }
  .done-inner { width: 100%; max-width: 480px; }
  #done h1 { font-weight: 450; font-size: 30px; letter-spacing: -0.02em; margin: 0 0 10px; }
  #tally { color: var(--dim); font-family: var(--mono); font-size: 13px; margin: 0 0 30px; line-height: 2; }
  #tally b { color: var(--text); font-weight: 500; }
  .done-row { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #run-status { font-family: var(--mono); font-size: 12.5px; color: var(--dim); min-height: 20px; margin-top: 14px; }
  #done .others { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(6px);
    background: var(--raised); border: 1px solid var(--line); font-family: var(--mono); font-size: 12.5px;
    padding: 10px 16px; border-radius: 7px; opacity: 0; pointer-events: none;
    transition: opacity var(--snap), transform var(--snap); z-index: 50; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 1ms !important; } }
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<section id="home">
  <div>
    <svg class="mark" width="46" height="46" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M13 9 L7 16 L13 23" fill="none" stroke="#c8664a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M19 9 L25 16 L19 23" fill="none" stroke="#63ac86" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Open a folder of photos.</h1>
    <button class="btn big" id="open">Open folder</button>
    <span id="err"></span>
    <p class="sub">Send each photo left or right. You pick what the arrows do.<br />Nothing leaves your computer.</p>
  </div>
</section>

<!-- ============ DECK ============ -->
<section id="deck" class="hidden">
  <div class="top">
    <span class="n" id="n"></span>
    <span class="f" id="f"></span>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="stage" id="stage">
    <span class="wash l" id="wash-l"></span>
    <span class="wash r" id="wash-r"></span>
    <div id="plate"><img id="shot" alt="" /></div>
  </div>
  <div class="strip" id="strip"></div>
  <div class="choices">
    <button class="choice l" id="go-l"><span class="arrow">←</span><span class="what" id="what-l">Delete</span></button>
    <button class="choice r" id="go-r"><span class="arrow">→</span><span class="what" id="what-r">Keep</span></button>
  </div>
  <div class="under">
    <button class="link" id="undo">undo</button>
    <button class="link" id="settings">change what the arrows do</button>
    <button class="link" id="finish">finish</button>
  </div>
</section>

<!-- ============ SHEET ============ -->
<div id="sheet" class="hidden">
  <div class="card" role="dialog" aria-modal="true" aria-label="What the arrows do">
    <h2>What should the arrows do?</h2>
    <p class="hint">Nothing happens to a file until you press the button at the end.</p>
    <div class="set l">
      <span class="tag">← Left</span>
      <div class="opts">
        <button class="opt" data-side="l" data-act="delete">Delete</button>
        <button class="opt" data-side="l" data-act="keep">Keep</button>
        <button class="opt" data-side="l" data-act="move" id="move-l">Move to…</button>
      </div>
    </div>
    <div class="set r">
      <span class="tag">Right →</span>
      <div class="opts">
        <button class="opt" data-side="r" data-act="delete">Delete</button>
        <button class="opt" data-side="r" data-act="keep">Keep</button>
        <button class="opt" data-side="r" data-act="move" id="move-r">Move to…</button>
      </div>
    </div>
    <div id="sheet-err"></div>
    <div class="foot">
      <span class="tag" id="sheet-note"></span>
      <button class="btn" id="sheet-close">Done</button>
    </div>
  </div>
</div>

<!-- ============ DONE ============ -->
<section id="done" class="hidden">
  <div class="done-inner">
    <h1 id="done-h">All decided.</h1>
    <p id="tally"></p>
    <div class="done-row">
      <button class="btn big" id="run">Apply</button>
      <button class="link" id="copy">copy the list instead</button>
    </div>
    <div id="run-status"></div>
    <div class="others">
      <button class="link" id="back">back to photos</button>
      <button class="link" id="restart">start over</button>
    </div>
  </div>
</section>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";

  const IMG_RE = /\.(png|jpe?g|gif|webp|avif|bmp|svg)$/i;
  const STORE = "cull.v3";
  const $ = (id) => document.getElementById(id);
  const screens = { home: $("home"), deck: $("deck"), done: $("done") };

  let shots = [];              /* { name, url, handle } */
  let at = 0;
  let sent = {};               /* filename -> "l" | "r" */
  let srcDir = null;
  let acts = { l: { kind: "delete", dir: null }, r: { kind: "keep", dir: null } };
  let running = false;

  const canWrite = () => typeof window.showDirectoryPicker === "function";
  const srcName = () => (srcDir ? srcDir.name : "this folder");
  const actLabel = (side) => {
    const a = acts[side];
    if (a.kind === "delete") return "Delete";
    if (a.kind === "keep") return "Keep";
    return a.dir ? a.dir.name : "Move to…";
  };

  let toastTimer = null;
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }
  function show(name) { for (const k in screens) screens[k].classList.toggle("hidden", k !== name); }

  /* ---------- remember decisions per folder ---------- */
  function load() {
    try { sent = (JSON.parse(localStorage.getItem(STORE)) || {})[srcName()] || {}; } catch { sent = {}; }
  }
  function save() {
    try {
      const all = JSON.parse(localStorage.getItem(STORE)) || {};
      all[srcName()] = sent;
      localStorage.setItem(STORE, JSON.stringify(all));
    } catch { /* private browsing or full quota: decisions just will not survive a reload */ }
  }

  /* ---------- opening a folder ---------- */
  $("open").addEventListener("click", async () => {
    $("err").textContent = "";
    let found;
    if (canWrite()) {
      let handle;
      try { handle = await window.showDirectoryPicker({ mode: "readwrite", id: "cull-src" }); } catch { return; }
      srcDir = handle;
      found = [];
      try {
        for await (const entry of handle.values()) {
          if (entry.kind === "file" && IMG_RE.test(entry.name) && !entry.name.startsWith(".")) {
            found.push({ name: entry.name, handle: entry, url: null });
          }
        }
        for (const s of found) s.url = URL.createObjectURL(await s.handle.getFile());
      } catch { $("err").textContent = "Could not read that folder."; return; }
    } else {
      srcDir = null;
      found = await pickViaInput();
      acts = { l: { kind: "keep", dir: null }, r: { kind: "keep", dir: null } };
    }
    if (!found.length) { $("err").textContent = "No photos in that folder."; return; }
    found.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    shots.forEach((s) => URL.revokeObjectURL(s.url));
    shots = found;
    load();
    at = shots.findIndex((s) => !(s.name in sent));
    if (at === -1) at = shots.length;
    show("deck");
    paint();
  });

  function pickViaInput() {
    return new Promise((resolve) => {
      const input = document.createElement("input");
      input.type = "file"; input.multiple = true; input.webkitdirectory = true;
      input.addEventListener("change", () => {
        resolve(Array.from(input.files || [])
          .filter((f) => IMG_RE.test(f.name) && !f.name.startsWith("."))
          .map((f) => ({ name: f.name, handle: null, url: URL.createObjectURL(f) })));
      }, { once: true });
      input.click();
    });
  }

  /* ---------- the deck ---------- */
  const doneCount = () => shots.reduce((n, s) => n + (s.name in sent ? 1 : 0), 0);

  function paint() {
    if (at >= shots.length) { openDone(); return; }
    const cur = shots[at];
    $("shot").src = cur.url;
    $("shot").alt = cur.name;
    $("f").textContent = cur.name;
    $("n").innerHTML = (at + 1) + "<span> / " + shots.length + "</span>";
    $("bar").style.width = (doneCount() / shots.length) * 100 + "%";
    $("what-l").textContent = actLabel("l");
    $("what-r").textContent = actLabel("r");
    $("go-l").classList.toggle("on", sent[cur.name] === "l");
    $("go-r").classList.toggle("on", sent[cur.name] === "r");
    paintStrip();
  }

  function paintStrip() {
    const strip = $("strip");
    strip.textContent = "";
    const reach = window.innerWidth < 620 ? 3 : 5;
    for (let i = Math.max(0, at - reach); i <= Math.min(shots.length - 1, at + reach); i++) {
      const s = shots[i];
      const b = document.createElement("button");
      b.className = "thumb" + (i === at ? " now" : "");
      b.title = s.name;
      const img = document.createElement("img");
      img.src = s.url; img.alt = "";
      b.appendChild(img);
      if (sent[s.name]) { const flag = document.createElement("i"); flag.className = sent[s.name]; b.appendChild(flag); }
      b.addEventListener("click", () => { at = i; paint(); });
      strip.appendChild(b);
    }
  }

  function send(side) {
    if (at >= shots.length) return;
    sent[shots[at].name] = side;
    save();
    const plate = $("plate");
    plate.classList.add(side === "l" ? "gone-l" : "gone-r");
    setTimeout(() => { plate.classList.remove("gone-l", "gone-r"); at++; paint(); }, 130);
  }
  function undo() { at = Math.max(0, Math.min(at, shots.length) - 1); show("deck"); paint(); }

  $("go-l").addEventListener("click", () => send("l"));
  $("go-r").addEventListener("click", () => send("r"));
  $("undo").addEventListener("click", undo);
  $("finish").addEventListener("click", openDone);

  /* drag the photo either way */
  const stage = $("stage");
  let from = null, dx = 0;
  const PULL = 90;
  stage.addEventListener("pointerdown", (e) => {
    if (at >= shots.length || e.button !== 0) return;
    from = e.clientX; dx = 0;
    $("plate").classList.add("drag");
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", (e) => {
    if (from === null) return;
    dx = e.clientX - from;
    $("plate").style.transform = "translateX(" + dx + "px) rotate(" + dx / 46 + "deg)";
    $("wash-l").classList.toggle("on", dx < -PULL);
    $("wash-r").classList.toggle("on", dx > PULL);
  });
  function release() {
    if (from === null) return;
    const moved = dx;
    from = null;
    $("plate").classList.remove("drag");
    $("plate").style.transform = "";
    $("wash-l").classList.remove("on"); $("wash-r").classList.remove("on");
    if (moved < -PULL) send("l");
    else if (moved > PULL) send("r");
  }
  stage.addEventListener("pointerup", release);
  stage.addEventListener("pointercancel", release);

  document.addEventListener("keydown", (e) => {
    if (!$("sheet").classList.contains("hidden")) { if (e.key === "Escape") closeSheet(); return; }
    if (screens.deck.classList.contains("hidden")) return;
    if (e.key === "ArrowLeft") { e.preventDefault(); send("l"); }
    else if (e.key === "ArrowRight") { e.preventDefault(); send("r"); }
    else if (e.key === "z" || e.key === "Z" || e.key === "Backspace") { e.preventDefault(); undo(); }
  });

  /* ---------- what the arrows do ---------- */
  function paintSheet() {
    document.querySelectorAll(".opt").forEach((o) => {
      o.classList.toggle("on", acts[o.dataset.side].kind === o.dataset.act);
    });
    $("move-l").textContent = acts.l.dir ? acts.l.dir.name : "Move to…";
    $("move-r").textContent = acts.r.dir ? acts.r.dir.name : "Move to…";
    $("sheet-note").textContent = canWrite() ? "" : "this browser cannot change files";
    document.querySelectorAll('.opt[data-act="delete"], .opt[data-act="move"]').forEach((o) => { o.disabled = !canWrite(); });
  }
  function openSheet() { $("sheet-err").textContent = ""; paintSheet(); $("sheet").classList.remove("hidden"); }
  function closeSheet() { $("sheet").classList.add("hidden"); paint(); }
  $("settings").addEventListener("click", openSheet);
  $("sheet-close").addEventListener("click", closeSheet);
  $("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) closeSheet(); });

  document.querySelectorAll(".opt").forEach((opt) => {
    opt.addEventListener("click", async () => {
      const side = opt.dataset.side, act = opt.dataset.act;
      $("sheet-err").textContent = "";
      if (act !== "move") { acts[side] = { kind: act, dir: null }; paintSheet(); return; }
      let dir;
      try { dir = await window.showDirectoryPicker({ mode: "readwrite", id: "cull-dest-" + side }); } catch { return; }
      if (srcDir && (await srcDir.isSameEntry(dir))) {
        $("sheet-err").textContent = "That is the folder you are sorting. Pick a different one.";
        return;
      }
      acts[side] = { kind: "move", dir };
      paintSheet();
    });
  });

  /* ---------- the end ---------- */
  const pile = (side) => shots.filter((s) => sent[s.name] === side).map((s) => s.name);

  function plan() {
    const jobs = [];
    for (const s of shots) {
      const side = sent[s.name];
      if (!side) continue;
      const a = acts[side];
      if (a.kind === "keep") continue;
      if (a.kind === "move" && !a.dir) continue;
      jobs.push({ shot: s, kind: a.kind, dir: a.dir });
    }
    return jobs;
  }

  function openDone() {
    const jobs = plan();
    const dels = jobs.filter((j) => j.kind === "delete").length;
    const moves = jobs.filter((j) => j.kind === "move").length;
    const untouched = shots.length - dels - moves;
    $("done-h").textContent = doneCount() < shots.length ? "Stopped early." : "All decided.";
    const bits = [];
    if (dels) bits.push("<b>" + dels + "</b> to delete");
    if (moves) bits.push("<b>" + moves + "</b> to move");
    bits.push("<b>" + untouched + "</b> staying put");
    $("tally").innerHTML = bits.join("<br />");
    const label = [];
    if (dels) label.push("Delete " + dels);
    if (moves) label.push("Move " + moves);
    $("run").textContent = label.length ? label.join(" and ") : "Nothing to do";
    $("run").disabled = !label.length || !canWrite() || !srcDir;
    $("run-status").textContent = "";
    show("done");
  }

  async function allow(handle) {
    if (!handle.requestPermission) return true;
    try { return (await handle.requestPermission({ mode: "readwrite" })) === "granted"; } catch { return false; }
  }
  async function nameFree(dir, name) {
    try { await dir.getFileHandle(name); return false; } catch { return true; }
  }
  async function freeName(dir, name) {
    if (await nameFree(dir, name)) return name;
    const dot = name.lastIndexOf(".");
    const stem = dot > 0 ? name.slice(0, dot) : name;
    const ext = dot > 0 ? name.slice(dot) : "";
    for (let n = 1; n < 500; n++) {
      const tryName = stem + "-" + n + ext;
      if (await nameFree(dir, tryName)) return tryName;
    }
    return stem + "-" + Date.now() + ext;
  }

  async function run() {
    if (running) return;
    const jobs = plan().filter((j) => j.shot.handle);
    if (!jobs.length) return;
    const dels = jobs.filter((j) => j.kind === "delete").length;
    const moves = jobs.filter((j) => j.kind === "move").length;
    const summary = [dels ? "delete " + dels + " files" : "", moves ? "move " + moves + " files" : ""].filter(Boolean).join(" and ");
    if (!confirm("About to " + summary + " in " + srcName() + ".\nDeletes cannot be undone.")) return;
    if (!(await allow(srcDir))) { toast("permission denied"); return; }
    for (const side of ["l", "r"]) {
      if (acts[side].kind === "move" && acts[side].dir && !(await allow(acts[side].dir))) { toast("permission denied"); return; }
    }

    running = true;
    $("run").disabled = true;
    const finished = [], failed = [];
    for (let i = 0; i < jobs.length; i++) {
      const job = jobs[i];
      $("run-status").textContent = (i + 1) + " of " + jobs.length + " · " + job.shot.name;
      try {
        if (job.kind === "move") {
          const file = await job.shot.handle.getFile();
          const target = await freeName(job.dir, job.shot.name);
          const fh = await job.dir.getFileHandle(target, { create: true });
          const stream = await fh.createWritable();
          await stream.write(file);
          await stream.close();
          const landed = await (await job.dir.getFileHandle(target)).getFile();
          /* only let go of the original once the copy is provably the same size */
          if (landed.size !== file.size) { failed.push(job.shot.name); continue; }
        }
        await srcDir.removeEntry(job.shot.name);
        finished.push(job.shot.name);
      } catch { failed.push(job.shot.name); }
    }

    const gone = new Set(finished);
    shots = shots.filter((s) => {
      if (!gone.has(s.name)) return true;
      URL.revokeObjectURL(s.url); delete sent[s.name]; return false;
    });
    save();
    running = false;
    at = 0;
    $("run-status").textContent = "Done. " + finished.length + " handled" +
      (failed.length ? ", " + failed.length + " left alone: " + failed.join(", ") : "") + ".";
    toast(finished.length + " handled");
    openDone();
  }
  $("run").addEventListener("click", run);

  function listText() {
    const out = [];
    for (const side of ["l", "r"]) {
      const names = pile(side);
      if (!names.length) continue;
      const a = acts[side];
      const verb = a.kind === "delete" ? "Delete from " + srcName()
        : a.kind === "move" ? "Move to " + (a.dir ? a.dir.name : "another folder")
        : "Leave alone in " + srcName();
      out.push(verb + ":", ...names.map((n) => "- " + n), "");
    }
    if (!out.length) return "Nothing decided yet.";
    out.push("Only touch these exact files. Adjust the folder paths if they are not where you expect.");
    return out.join("\n");
  }
  $("copy").addEventListener("click", async () => {
    const text = listText();
    try { await navigator.clipboard.writeText(text); toast("list copied"); }
    catch {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("list copied"); } catch { toast("press cmd-c"); }
      ta.remove();
    }
  });
  $("back").addEventListener("click", () => { at = Math.min(at, Math.max(0, shots.length - 1)); show("deck"); paint(); });
  $("restart").addEventListener("click", () => {
    if (!confirm("Forget every decision for " + srcName() + "?")) return;
    sent = {}; save(); at = 0; show("deck"); paint();
  });

  window.addEventListener("resize", () => { if (!screens.deck.classList.contains("hidden")) paintStrip(); });
})();
</script>
</body>
</html>
